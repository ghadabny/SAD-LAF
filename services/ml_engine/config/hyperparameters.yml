lgbm:
  objective: "regression"
  metric: "rmse"
  boosting_type: "gbdt"
  # Meilleure configuration identifiée par grid search manuel (training_history.json)
  # Run du 2026-03-30 : lr=0.05 / n_est=2000 → RMSE=0.1107, R²=0.8985, Spearman=0.9297
  learning_rate: 0.05
  num_leaves: 31
  n_estimators: 2000
  min_child_samples: 20       # évite les feuilles sur micro-cas isolés
  verbose: -1
  random_state: 42