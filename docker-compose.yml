# docker-compose.yml — SAD-LAF
# Une seule commande : docker-compose up

networks:
  sad_laf_net:
    driver: bridge

volumes:
  sad_laf_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/data"

x-env-data: &env-data
  GTFS_DIR: /app/data/raw/gtfs
  LAF_DIR: /app/data/raw/laf
  MODELS_DIR: /app/data/models
  OUTPUTS_DIR: /app/data/outputs
  PROCESSED_DIR: /app/data/processed
  DATA_DIR: /app/data
  HTTP_PROXY: ""
  HTTPS_PROXY: ""

services:

  # ÉTAPE 1 — Téléchargement GTFS
  gtfs_downloader:
    build:
      context: .
      dockerfile: services/ml_engine/Dockerfile
    image: sad-laf-ml-engine:latest
    container_name: sad_laf_gtfs_downloader
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
    networks:
      - sad_laf_net
    command: ["python", "services/ml_engine/data/gtfs/downloader.py"]
    restart: on-failure

  # ÉTAPE 2 — Entraînement LightGBM
  ml_engine:
    build:
      context: .
      dockerfile: services/ml_engine/Dockerfile
    image: sad-laf-ml-engine:latest
    container_name: sad_laf_ml_engine
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
    networks:
      - sad_laf_net
    depends_on:
      gtfs_downloader:
        condition: service_completed_successfully
    command: ["python", "services/ml_engine/train.py"]
    restart: on-failure

  # ÉTAPE 3 — API FastAPI
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: sad-laf-api:latest
    container_name: sad_laf_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
      PREDICT_API_URL: "http://api:8000/predict/batch"
    networks:
      - sad_laf_net
    depends_on:
      ml_engine:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ÉTAPE 4 — Scheduler
  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    image: sad-laf-scheduler:latest
    container_name: sad_laf_scheduler
    restart: unless-stopped
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
    networks:
      - sad_laf_net
    depends_on:
      api:
        condition: service_healthy

  # ÉTAPE 5 — Export CSV
  exporter:
    build:
      context: .
      dockerfile: services/exporter/Dockerfile
    image: sad-laf-exporter:latest
    container_name: sad_laf_exporter
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
    networks:
      - sad_laf_net
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "services.exporter.export", "--all"]
    restart: on-failure