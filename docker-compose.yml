# docker-compose.yml — SAD-LAF
# ─────────────────────────────────────────────────────────────────────────────
#
# DÉMARRAGE QUOTIDIEN (automatique via Windows Task Scheduler au boot) :
#   docker-compose up -d api scheduler
#
# GTFS Static    → téléchargé automatiquement par le scheduler tous les jours à 03:00
# GTFS-RT        → mis à jour automatiquement par le scheduler toutes les 2 minutes
# Export CSV     → déclenché automatiquement à chaque POST /optimize
# Listener       → intégré dans l'API, surveille data/requests/ et data/decisions/
#
# MANUEL — uniquement lors d'une nouvelle livraison LAF :
#   docker-compose run --rm ml_engine
#
# ─────────────────────────────────────────────────────────────────────────────

networks:
  sad_laf_net:
    driver: bridge

volumes:
  sad_laf_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/data"

x-env-data: &env-data
  GTFS_DIR: /app/data/raw/gtfs
  LAF_DIR: /app/data/raw/laf
  MODELS_DIR: /app/data/models
  OUTPUTS_DIR: /app/data/outputs
  PROCESSED_DIR: /app/data/processed
  DATA_DIR: /app/data
  HTTP_PROXY: ""
  HTTPS_PROXY: ""

services:

  # ══════════════════════════════════════════════════════════════
  # SERVICE CONTINU 1 — API FastAPI + Listener event-driven
  #
  # Responsabilités :
  #   - Scoring ML (GET /predict)
  #   - Génération de tournées (POST /optimize)
  #   - Export CSV automatique après chaque /optimize
  #   - Listener : surveille data/requests/ et data/decisions/   ← AJOUT
  # ══════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: sad-laf-api:latest
    container_name: sad_laf_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
      PREDICT_API_URL: "http://api:8000/predict/batch"
      # ── Listener event-driven ────────────────────────────────
      # Ces chemins correspondent au volume monté /app/data.
      # Sur la ThinkStation, data/ est synchronisé avec OneDrive.
      REQUESTS_DIR: /app/data/requests
      DECISIONS_DIR: /app/data/decisions
      REQUEST_LISTENER_INTERVAL_SECONDS: 30
      DECISION_LISTENER_INTERVAL_SECONDS: 15
    networks:
      - sad_laf_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════
  # SERVICE CONTINU 2 — Scheduler APScheduler
  #
  # Responsabilités :
  #   - GTFS-RT toutes les 2 minutes (retards, suppressions)
  #   - GTFS Static tous les jours à 03:00 (nouveaux horaires)
  # ══════════════════════════════════════════════════════════════
  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    image: sad-laf-scheduler:latest
    container_name: sad_laf_scheduler
    restart: unless-stopped
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
    networks:
      - sad_laf_net
    depends_on:
      api:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════════
  # JOB MANUEL — Ré-entraînement LightGBM
  #
  # Lancer UNIQUEMENT lors d'une nouvelle livraison LAF :
  #   docker-compose run --rm ml_engine
  #
  # Ne démarre PAS avec docker-compose up (profile: tools)
  # ══════════════════════════════════════════════════════════════
  ml_engine:
    build:
      context: .
      dockerfile: services/ml_engine/Dockerfile
    image: sad-laf-ml-engine:latest
    container_name: sad_laf_ml_engine
    volumes:
      - sad_laf_data:/app/data
    environment:
      <<: *env-data
    networks:
      - sad_laf_net
    command: ["python", "services/ml_engine/train.py"]
    profiles: ["tools"]